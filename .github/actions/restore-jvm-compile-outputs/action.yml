name: Restore JVM compile outputs
description: Extract and verify JVM compile outputs from the Build JAR artifact before packaging

runs:
  using: composite
  steps:
    - name: Extract JVM compile outputs
      shell: bash
      run: |
        set -euo pipefail
        if [[ -f jvm-compile-outputs.tar.gz ]]; then
          tar -xzf jvm-compile-outputs.tar.gz
        elif [[ -f jvm-compile-outputs/jvm-compile-outputs.tar.gz ]]; then
          tar -xzf jvm-compile-outputs/jvm-compile-outputs.tar.gz
        fi
    - name: Verify JVM compile outputs
      shell: bash
      run: |
        set -euo pipefail
        missing=false
        for path in \
          app/shared/build/classes/kotlin/jvm/main \
          app/shared/build/generated/sources/appBuildInfo/kotlin \
          app/desktop/build/classes/kotlin/main
        do
          if [[ ! -d "$path" ]]; then
            echo "Missing $path" >&2
            missing=true
          fi
        done
        if [[ "$missing" == "true" ]]; then
          echo "JVM compile outputs artifact is incomplete" >&2
          exit 1
        fi
        echo "JVM compile outputs verified"
