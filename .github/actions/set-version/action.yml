name: Set release version
description: Makes versionName/versionCode available to Gradle for CI

inputs:
  version:
    description: Semantic version (e.g. 1.2.3)
    required: true

runs:
  using: composite
  steps:
    - name: Set version
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        VERSION_CODE="$(printf '%s' "$VERSION" | sed 's/[^0-9]//g')"
        if [[ -z "$VERSION_CODE" ]]; then
          VERSION_CODE=1
        fi
        # Injected as Gradle project properties rather than rewriting build.gradle.kts: that file
        # is hashed into the Gradle build-cache key, so editing it per release meant no release
        # could ever reuse the previous one's cache.
        {
          echo "ORG_GRADLE_PROJECT_versionName=$VERSION"
          echo "ORG_GRADLE_PROJECT_versionCode=$VERSION_CODE"
          echo "ORG_GRADLE_PROJECT_gitCommitSha=${{ github.sha }}"
          echo "ORG_GRADLE_PROJECT_gitHubRepository=${{ github.repository }}"
        } >> "$GITHUB_ENV"
        echo "versionName=$VERSION versionCode=$VERSION_CODE commit=${GITHUB_SHA} repo=${GITHUB_REPOSITORY}"
